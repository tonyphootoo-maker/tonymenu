<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <title>LineMenuViewer - กำลังเปิดหน้าเมนู...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      // Single Page Apps for GitHub Pages SPA redirect
      // Stores path and redirects to index.html with query/hash
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repoPath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var query = l.search ? '&' + l.search.slice(1) : '';
      var hash = l.hash ? l.hash : '';
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoPath + '/?redirect=' +
        encodeURIComponent(l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/')) +
        query +
        hash
      );
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      .loader {
        border: 3px solid #262626;
        border-top: 3px solid #f59e0b;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div>
      <div class="loader"></div>
      <p style="font-size: 14px; color: #a3a3a3;">กำลังโหลดข้อมูลใบเมนูอาหาร...</p>
    </div>
  </body>
</html>
